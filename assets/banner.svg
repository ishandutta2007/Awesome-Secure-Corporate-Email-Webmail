<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: url(#textGrad);
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 400;
      font-size: 19px;
      fill: #94a3b8;
    }
    .tagline {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 2px;
      fill: #38bdf8;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #e2e8f0;
    }

    /* Dynamic / Animated elements */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.08); }
    }
    @keyframes floatCard {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes sweepLine {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes orbitalRotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .pulsing-orb-1 {
      animation: pulseGlow 7s ease-in-out infinite;
      transform-origin: 950px 140px;
    }
    .pulsing-orb-2 {
      animation: pulseGlow 9s ease-in-out infinite alternate;
      transform-origin: 200px 320px;
    }
    .floating-badge {
      animation: floatCard 5s ease-in-out infinite;
    }
    .stream-line {
      stroke-dasharray: 20, 10;
      animation: sweepLine 20s linear infinite;
    }
    .orbiting {
      transform-origin: 980px 210px;
      animation: orbitalRotate 25s linear infinite;
    }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1198" height="418" x="1" y="1" rx="15" fill="none" stroke="#334155" stroke-opacity="0.4" stroke-width="1.5" />

  <!-- Animated Ambient Orbs in Background -->
  <g class="pulsing-orb-1">
    <circle cx="950" cy="140" r="160" fill="#0284c7" opacity="0.25" filter="url(#glow)" />
    <circle cx="1020" cy="180" r="110" fill="#10b981" opacity="0.18" filter="url(#glow)" />
  </g>
  <g class="pulsing-orb-2">
    <circle cx="180" cy="300" r="140" fill="#3b82f6" opacity="0.2" filter="url(#glow)" />
  </g>

  <!-- Decorative Network Grid Lines in Background -->
  <g stroke="#334155" stroke-opacity="0.25" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="420" />
    <line x1="240" y1="0" x2="240" y2="420" />
    <line x1="400" y1="0" x2="400" y2="420" />
    <line x1="560" y1="0" x2="560" y2="420" />
    <line x1="720" y1="0" x2="720" y2="420" />
    <line x1="880" y1="0" x2="880" y2="420" />
    <line x1="1040" y1="0" x2="1040" y2="420" />
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
  </g>

  <!-- Animated Dynamic Data Stream Line -->
  <path class="stream-line" d="M 600,280 C 720,280 780,180 880,180 C 980,180 1020,240 1140,240" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.4" />

  <!-- Right Side Visual: Cyber Email Security Shield & Orbital Rings -->
  <g transform="translate(930, 210)">
    <!-- Orbiting Ring -->
    <ellipse cx="0" cy="0" rx="140" ry="60" fill="none" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1.5" transform="rotate(-25)" />
    <g class="orbiting">
      <circle cx="120" cy="0" r="5" fill="#38bdf8" filter="url(#badgeGlow)" />
      <circle cx="-120" cy="0" r="4" fill="#34d399" filter="url(#badgeGlow)" />
    </g>

    <!-- Shield Base Glow -->
    <circle cx="0" cy="0" r="75" fill="#0f172a" stroke="#0284c7" stroke-width="2" filter="url(#badgeGlow)" />

    <!-- Mail & Lock Icon Inside Shield -->
    <path d="M -34,-24 L 34,-24 C 38,-24 42,-20 42,-16 L 42,24 C 42,28 38,32 34,32 L -34,32 C -38,32 -42,28 -42,24 L -42,-16 C -42,-20 -38,-24 -34,-24 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5" />
    <path d="M -40,-22 L 0,6 L 40,-22" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linejoin="round" />
    
    <!-- Security Lock Seal -->
    <circle cx="0" cy="10" r="16" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5" />
    <path d="M -5,10 L 5,10 C 6.5,10 7.5,11 7.5,12.5 L 7.5,17 C 7.5,18.5 6.5,19.5 5,19.5 L -5,19.5 C -6.5,19.5 -7.5,18.5 -7.5,17 L -7.5,12.5 C -7.5,11 -6.5,10 -5,10 Z" fill="#ffffff" />
    <path d="M -3.5,10 L -3.5,7 C -3.5,5  -2,3.5 0,3.5 C 2,3.5 3.5,5 3.5,7 L 3.5,10" fill="none" stroke="#ffffff" stroke-width="1.8" />
  </g>

  <!-- Left Side: Main Header Content (Pure Foreground - Never Obscured) -->
  <g transform="translate(75, 75)">
    <!-- Category Pill -->
    <rect x="0" y="0" width="280" height="28" rx="14" fill="#0369a1" fill-opacity="0.3" stroke="#0284c7" stroke-width="1" />
    <circle cx="14" cy="14" r="5" fill="#38bdf8" />
    <text x="28" y="19" class="tagline">Enterprise &amp; Self-Hosted Email</text>

    <!-- Main Title -->
    <text x="0" y="80" class="title">Secure Corporate Email</text>
    <text x="0" y="130" class="title">&amp; Webmail Solutions</text>

    <!-- Subtitle -->
    <text x="0" y="174" class="subtitle">Curated commercial SaaS platforms &amp; open-source groupware for custom domains,</text>
    <text x="0" y="200" class="subtitle">zero-trust encryption, regulatory compliance (HIPAA / GDPR / PCI), and IMAP/ActiveSync.</text>

    <!-- Feature Feature / Protocol Badges -->
    <g transform="translate(0, 235)" class="floating-badge">
      <!-- Badge 1: E2EE & S/MIME -->
      <g transform="translate(0, 0)">
        <rect width="138" height="34" rx="8" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="1" />
        <text x="14" y="22" class="pill-text">🔒 E2EE &amp; S/MIME</text>
      </g>
      <!-- Badge 2: Open Source -->
      <g transform="translate(150, 0)">
        <rect width="156" height="34" rx="8" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1" />
        <text x="14" y="22" class="pill-text">🚀 Self-Hosted Stacks</text>
      </g>
      <!-- Badge 3: ActiveSync -->
      <g transform="translate(318, 0)">
        <rect width="144" height="34" rx="8" fill="url(#cardGrad)" stroke="#06b6d4" stroke-width="1" />
        <text x="14" y="22" class="pill-text">📱 MS ActiveSync</text>
      </g>
      <!-- Badge 4: Zero Trust -->
      <g transform="translate(474, 0)">
        <rect width="168" height="34" rx="8" fill="url(#cardGrad)" stroke="#8b5cf6" stroke-width="1" />
        <text x="14" y="22" class="pill-text">🛡️ Zero-Trust Security</text>
      </g>
    </g>
  </g>
</svg>
